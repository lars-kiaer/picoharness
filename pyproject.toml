[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picoharness"
version = "0.1.0"
description = "A serial micro-agent harness for CPU-only edge hardware"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agent", "harness", "edge", "local-first", "sqlite", "llm"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Intended Audience :: Developers",
]
# No runtime dependencies. Deliberate: the target is an offline edge box, and
# every dependency is one more thing to provision by hand.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pico-failures = "picoharness.memory.failure:main"

[tool.hatch.build.targets.wheel]
packages = ["src/picoharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
