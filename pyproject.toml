[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picoharness"
version = "0.1.0"
description = "A serial micro-agent harness for CPU-only edge hardware"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lars Kiær" }]
keywords = ["agent", "harness", "edge", "local-first", "sqlite", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No runtime dependencies. Deliberate: the target is an offline edge box, and
# every dependency is one more thing to provision by hand.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# The `gguf` adapter, and only that adapter. It stays out of `dependencies`
# because a box that runs no model must not carry it, and because the promise
# above is about what the runtime needs, not about what one provider kind
# needs. Know the size of it: this pulls numpy, jinja2, diskcache, MarkupSafe
# and typing-extensions as well, and on an offline ARM board that is six
# wheels to carry or a compile to run there.
gguf = ["llama-cpp-python>=0.3"]

[project.urls]
Homepage = "https://github.com/lars-kiaer/picoharness"
Documentation = "https://github.com/lars-kiaer/picoharness/blob/main/docs/serial-micro-agent-harness.md"
Source = "https://github.com/lars-kiaer/picoharness"
Issues = "https://github.com/lars-kiaer/picoharness/issues"

[project.scripts]
pico-failures = "picoharness.memory.failure:main"

[tool.hatch.build.targets.wheel]
packages = ["src/picoharness"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs/", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
# E/F  pycodestyle and pyflakes   I  import order
# UP   pyupgrade                  B  bugbear
# RUF  ruff-specific
select = ["E", "F", "I", "UP", "B", "RUF"]
# `__all__` is grouped by meaning, not alphabetically. The grouping is the
# documentation: the index and its value objects, then the failure store.
ignore = ["RUF022"]
