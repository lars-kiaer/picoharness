name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the version development runs on.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      # The package declares no runtime dependencies on purpose: the target is
      # an offline edge box, and every dependency is one more thing to
      # provision by hand. This step fails if one creeps in.
      - name: Assert no runtime dependencies
        run: |
          python - <<'PY'
          import tomllib, pathlib, sys
          deps = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["dependencies"]
          if deps:
              sys.exit(f"runtime dependencies appeared: {deps}")
          print("no runtime dependencies")
          PY
